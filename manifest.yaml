apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  # these lables are replica set lables
  labels:
    project: roboshop
    purpose: rs-demo
    tier: frontend
  annotations:
    kubernetes.io/change-cause: "moving to 1.29.7"
spec:

  replicas: 7
  selector:
  # using these labels replica set selects the pod
    matchLabels:
      project: roboshop
      purpose: rs-demo
      tier: frontend
# This is pod definition. pod is subset of replica set
  template:
    metadata:
      labels:
        project: roboshop
        purpose: rs-demo
        tier: frontend
    spec:
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            project: roboshop
            purpose: rs-demo
            tier: frontend
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            project: roboshop
            purpose: rs-demo
            tier: frontend
      containers:
      - name: nginx
        image: nginx:1.29.7

---

apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nginx
spec:
  minAvailable: "60%"
  selector:
    matchLabels:
      project: roboshop
      purpose: rs-demo
      tier: frontend
